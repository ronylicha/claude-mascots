; Firmware claude-mascots pour ESP32-2432S028 (« Cheap Yellow Display », 320x240, ST7789 ou ILI9341).
; Flasher : pio run -e cyd -t upload   |   Moniteur : pio device monitor -e cyd
; Tests du décodeur sur PC : pio test -e native

[platformio]
default_envs = cyd

[env]
; pioarduino = cœur Arduino 3.3 (IDF 5) maintenu ; version épinglée pour des builds reproductibles.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
lib_deps =
  bblanchon/ArduinoJson@7.4.3

[env:cyd]
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.32
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=0
  ; Les versions USB-C ont un ST7789 aux couleurs inversées (le bouton BOOT bascule à chaud).
  ; Carte micro-USB seule à ILI9341 : ajouter -DMASCOTS_PANEL_ILI9341=1 et passer l'inversion à 0.
  -DMASCOTS_DEFAULT_INVERT=1
build_unflags = -std=gnu++11
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra
test_build_src = no
build_src_filter = -<*>
lib_compat_mode = off
